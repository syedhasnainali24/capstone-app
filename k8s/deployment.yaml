apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: capstone-app
    spec:
      containers:
        - name: app
          image: REGISTRY_IP:5000/capstone-app:1.0
          ports:
            - containerPort: 5000
          env:
            - name: OWNER
              value: "OWNER_ID"
            - name: TOKEN
              value: "TOKEN_VALUE"
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-app
spec:
  type: NodePort
  selector:
    app: capstone-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
